<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Diagramico: quadro infinito para diagramas lógicos e user flows, com exportação em texto para IA.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233347d4'/%3E%3Cpath d='M7 10h9l-2.5 6H7z M18 17l5 5-5 5-5-5z' fill='white'/%3E%3C/svg%3E">
<title>Diagramico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap">
<style>
/* Layout: full-bleed infinite canvas; floating chrome (top bar, left tool rail, contextual bar, zoom) */
:root{
  --theme: light;
  --bg:#f3f4f7; --panel:#ffffff; --panel-2:#f0f2f6; --line:#dde1e9; --ink:#1b1f2a; --muted:#646b7b;
  --accent:#3347d4; --accent-ink:#ffffff; --accent-soft:#e3e7ff; --danger:#c43c2c;
  --shadow:0 1px 2px rgba(20,26,45,.06),0 6px 20px rgba(20,26,45,.08);
  --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --theme: dark;
  --bg:#14161b; --panel:#1d2027; --panel-2:#252932; --line:#323743; --ink:#e7e9ef; --muted:#9aa1b0;
  --accent:#8b98ff; --accent-ink:#11131a; --accent-soft:#2a3060; --danger:#ff8a78;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --theme: dark;
  --bg:#14161b; --panel:#1d2027; --panel-2:#252932; --line:#323743; --ink:#e7e9ef; --muted:#9aa1b0;
  --accent:#8b98ff; --accent-ink:#11131a; --accent-soft:#2a3060; --danger:#ff8a78;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:34px;height:34px;padding:0 8px;border:0;border-radius:7px;background:transparent;cursor:pointer;white-space:nowrap}
.ibtn:hover{background:var(--panel-2)}
.ibtn:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ibtn.on{background:var(--accent-soft);color:var(--accent)}
.ibtn svg{width:20px;height:20px;flex:none}
.btn{height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.hsep{height:1px;width:22px;background:var(--line);margin:4px auto}

/* Top bar */
.topbar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.topbar>*{pointer-events:auto}
.docbox{display:flex;align-items:center;gap:4px;padding:4px 10px 4px 4px;min-width:0}
.brand{font-weight:600;letter-spacing:.01em;padding:0 4px 0 2px}
.brand b{color:var(--accent);font-weight:600}
#docName{border:0;background:transparent;font:500 13px var(--sans);color:var(--ink);padding:5px 6px;border-radius:6px;width:16ch;min-width:6ch}
#docName:hover{background:var(--panel-2)}
#saveState{font:11px var(--mono);color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.exportbox{display:flex;gap:6px;padding:4px}

/* Tool rail */
.tools{position:fixed;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;padding:4px;gap:2px;z-index:5}
.tools .ibtn{width:38px;height:38px;padding:0;position:relative}
.tools .ibtn .k{position:absolute;right:3px;bottom:1px;font:9px var(--mono);color:var(--muted)}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:5px;white-space:nowrap}

/* Context bar */
.ctxbar{position:fixed;z-index:6;display:flex;align-items:center;gap:2px;padding:3px;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.ctxbar>*{flex:none}
.ctxbar .ibtn{height:30px;min-width:30px}
.ctxbar .fs{font:12px var(--mono);min-width:28px;text-align:center;color:var(--muted)}
.ctxbar select{height:30px;border:0;background:transparent;font:inherit;color:var(--ink);border-radius:6px;padding:0 4px;cursor:pointer}
.ctxbar select:hover{background:var(--panel-2)}
.sw{width:18px;height:18px;border-radius:50%;border:1.5px solid;cursor:pointer;padding:0;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.swrow{display:flex;gap:6px;padding:0 6px}

/* Zoom */
.zoom{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;padding:3px;gap:2px;z-index:5}
#zoomPct{font:12px var(--mono);min-width:48px}
.helpbtn{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;padding:3px}

/* Text editor overlay */
#ta{position:fixed;z-index:4;border:0;outline:none;background:transparent;color:var(--ink);resize:none;overflow:hidden;padding:0;margin:0;white-space:pre-wrap;word-break:break-word;caret-color:var(--accent)}

/* Drawer */
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(340px,100vw);z-index:20;background:var(--panel);border-right:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.drawer h2{font-size:15px;margin:0;flex:1}
.doclist{flex:1;overflow:auto;padding:4px 8px;display:flex;flex-direction:column;gap:2px}
.docitem{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.docitem:hover{background:var(--panel-2)}
.docitem.cur{background:var(--accent-soft)}
.docitem .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.docitem .meta{grid-column:1;font:11px var(--mono);color:var(--muted)}
.docitem .acts{grid-row:1/3;grid-column:2;display:flex;gap:2px;opacity:.0}
.docitem:hover .acts,.docitem:focus-within .acts,.docitem.cur .acts{opacity:1}
.docitem .acts .ibtn{width:28px;height:28px;min-width:28px;padding:0}
.docitem .acts .ibtn svg{width:16px;height:16px}
.drawer footer{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px}
.drawer footer p{margin:0 0 4px;width:100%;color:var(--muted);font-size:12px;line-height:1.45}
.drawer footer p.sub{margin:8px 0 0;font-weight:600;color:var(--ink);font-size:12px}
.issues{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px}
.issues li{display:flex;flex-direction:column;gap:3px;padding:10px 12px;background:var(--panel-2);border-radius:8px;line-height:1.45;max-width:72ch}
.issues li strong{font-weight:600}
.issues li .fix{color:var(--muted);font-size:12px}
.issues li .fix b{color:var(--accent);font-weight:600}
.modal textarea.import{width:100%;min-height:240px;box-sizing:border-box;font:12px/1.55 var(--mono);background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical;outline:none}
.modal textarea.import:focus{border-color:var(--accent)}
.modal .summary{font-size:15px;font-weight:500;margin:0 0 10px}
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.25);z-index:19}

/* Modal */
.modal{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(10,12,20,.3);padding:16px}
.modal .card{width:min(760px,100%);max-height:min(86vh,800px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.modal header{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;flex-wrap:wrap}
.modal h2{margin:0;font-size:15px;flex:1}
.tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.modal .body{padding:12px 16px;overflow:auto;min-height:0;flex:1}
.modal pre{margin:0;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--panel-2);border-radius:8px;padding:12px;max-height:48vh;overflow:auto;user-select:text}
.modal .hint{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 10px;max-width:70ch}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px 14px;flex-wrap:wrap;align-items:center}
.modal footer .stat{margin-right:auto;font:11px var(--mono);color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:12px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.preview{background:var(--panel-2);border-radius:8px;display:grid;place-items:center;padding:12px;max-height:46vh;overflow:auto}
.preview img{max-width:100%;max-height:42vh;border-radius:4px;box-shadow:var(--shadow)}

/* Help */
.help{position:fixed;left:10px;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:7;width:min(380px,calc(100vw - 20px));max-height:70vh;overflow:auto;padding:14px 16px}
.help h3{margin:0 0 8px;font-size:13px}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0 0 12px}
.help dt{font:11px var(--mono);color:var(--muted);white-space:nowrap}
.help dd{margin:0}
.help code{font:12px var(--mono);background:var(--panel-2);padding:1px 4px;border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}

/* Drawer: one full-width button per line */
.drawer footer .btn{flex:1 1 100%;text-align:left}
/* Embedded demo (landing page) */
.embed .topbar,.embed .tools,.embed .zoom,.embed .helpbtn,.embed .ctxbar,.embed .toast{display:none!important}
.embed #cv{cursor:grab}
/* Guided tour */
.tour-block{position:fixed;inset:0;z-index:50}
.tour-hl{position:fixed;z-index:51;border-radius:10px;pointer-events:none;box-shadow:0 0 0 9999px rgba(10,12,20,.55);outline:2px solid var(--accent);transition:all .2s}
.tour-card{position:fixed;z-index:52;width:min(340px,calc(100vw - 20px));padding:14px 16px}
.tour-card h3{margin:0 0 6px;font-size:14px}
.tour-card p{margin:0 0 12px;line-height:1.5}
.tour-card .row{display:flex;align-items:center;gap:6px}
.tour-card .row .n{flex:1;font:11px var(--mono);color:var(--muted)}
.tour-card b{font-weight:600}
@media (prefers-reduced-motion:reduce){.tour-hl{transition:none}}
@media (max-width:700px){
  .tools{top:auto;transform:none;left:10px;right:10px;bottom:calc(54px + env(safe-area-inset-bottom,0px));flex-direction:row;overflow-x:auto}
  .tools .hsep{width:1px;height:22px;margin:auto 4px}
  .tools .ibtn{flex:none}
  .brand{display:none}
  #saveState{display:none}
  .exportbox .lbl{display:none}
  .topbar{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<canvas id="cv" tabindex="0" data-i18n-aria="board"></canvas>
<textarea id="ta" hidden spellcheck="false" data-i18n-aria="editText"></textarea>

<div class="topbar">
  <div class="panel docbox">
    <button class="ibtn" id="btnMenu" data-i18n-title="menuTitle" data-i18n-aria="diagrams"></button>
    <span class="brand">Diagram<b>ico</b></span>
    <span class="sep"></span>
    <input id="docName" data-i18n-aria="docName" spellcheck="false">
    <span id="saveState"></span>
  </div>
  <div class="spacer"></div>
  <div class="panel exportbox">
    <button class="ibtn" id="btnLang"></button>
    <button class="ibtn" id="btnTheme"></button>
    <button class="btn primary" id="btnExport" data-i18n="export" data-i18n-title="exportTitle"></button>
  </div>
</div>

<nav class="panel tools" id="tools" data-i18n-aria="tools"></nav>
<div class="panel ctxbar" id="ctx" hidden></div>

<div class="panel zoom">
  <button class="ibtn" id="zOut" data-i18n-title="zoomOut" data-i18n-aria="zoomOut"></button>
  <button class="ibtn" id="zoomPct" data-i18n-title="zoom100">100%</button>
  <button class="ibtn" id="zIn" data-i18n-title="zoomIn" data-i18n-aria="zoomIn"></button>
  <span class="sep"></span>
  <button class="ibtn" id="zFit" data-i18n-title="fitAll" data-i18n-aria="fitAll"></button>
  <button class="ibtn" id="bLayout" data-i18n-title="autoLayout" data-i18n-aria="autoLayout"></button>
  <span class="sep"></span>
  <button class="ibtn" id="bUndo" data-i18n-title="undo" data-i18n-aria="undo"></button>
  <button class="ibtn" id="bRedo" data-i18n-title="redo" data-i18n-aria="redo"></button>
</div>
<div class="panel helpbtn"><button class="ibtn" id="btnHelp" data-i18n-title="help" data-i18n-aria="help">?</button><button class="ibtn" id="btnTour" data-i18n-title="tourBtn" data-i18n-aria="tourBtn"></button></div>

<div class="panel help" id="help" hidden data-i18n-html="helpHtml"></div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden data-i18n-aria="diagrams">
  <header><h2 data-i18n="diagrams"></h2><button class="btn primary" id="btnNew" data-i18n="new"></button><button class="ibtn" id="btnCloseDrawer" data-i18n-aria="close"></button></header>
  <div class="doclist" id="doclist"></div>
  <footer>
    <p data-i18n="drawerNote"></p>
    <button class="btn" id="btnBackup" data-i18n="backup"></button>
    <button class="btn" id="btnImport" data-i18n="importJson"></button>
    <p class="sub" data-i18n="importFrom"></p>
    <button class="btn" id="btnImpDrawio" data-i18n="imp_drawio"></button>
    <button class="btn" id="btnImpVisio" data-i18n="imp_visio"></button>
    <button class="btn" id="btnImpText" data-i18n="txt_btn"></button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <input type="file" id="fileImp" hidden>
  </footer>
</aside>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h2 id="mTitle"></h2><button class="ibtn" id="mClose" data-i18n-aria="close"></button></header>
    <div class="tabs" id="mTabs"></div>
    <div class="body" id="mBody"></div>
    <footer id="mFoot"></footer>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
// ?embed=1 (used by the landing page): read-only demo — no chrome, no saving, no tour; ?lang=pt|en picks the language.
const QS = new URLSearchParams(location.search), EMBED = QS.get('embed') === '1';
const localStorage = EMBED ? {getItem:()=>null, setItem(){}, removeItem(){}} : {getItem:k=>window.localStorage.getItem(k), setItem:(k,v)=>window.localStorage.setItem(k,v), removeItem:k=>window.localStorage.removeItem(k)};
if (EMBED) document.documentElement.classList.add('embed');
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d'), ta = $('#ta');

/* ---------- icons ---------- */
const I = (d, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const ICON = {
  select: I('<path d="M5 3l14 8-6.5 1.5L9 19z"/>'),
  hand: I('<path d="M8 12V6.5a1.5 1.5 0 013 0V11m0-5.5V4.5a1.5 1.5 0 013 0V11m0-4.5a1.5 1.5 0 013 0V14a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L3.6 14a1.5 1.5 0 012.5-1.6L8 15"/>'),
  step: I('<rect x="3" y="6" width="18" height="12" rx="2.5"/>'),
  action: I('<path d="M7 6h14l-4 12H3z"/>'),
  decision: I('<path d="M12 3l9 9-9 9-9-9z"/>'),
  screen: I('<rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M3 8.5h18"/><circle cx="5.8" cy="6.5" r=".4"/><circle cx="7.6" cy="6.5" r=".4"/>'),
  doc: I('<path d="M4 4h16v13c-3-2.2-5.5 2.6-8 1.2S7 15.5 4 18z"/>'),
  data: I('<ellipse cx="12" cy="6" rx="7.5" ry="2.6"/><path d="M4.5 6v12c0 1.4 3.4 2.6 7.5 2.6s7.5-1.2 7.5-2.6V6"/>'),
  start: I('<circle cx="12" cy="12" r="7.5"/>'),
  end: I('<circle cx="12" cy="12" r="7" stroke-width="3.2"/>'),
  pause: I('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="6.3"/><path d="M10.3 9.6v4.8M13.7 9.6v4.8"/>'),
  handoff: I('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="6.3"/><path d="M9 10.5h6l-1.6-1.5M15 13.5H9l1.6 1.5"/>'),
  note: I('<path d="M4 4h16v11l-5 5H4z"/><path d="M15 20v-5h5"/><path d="M8 9h8M8 12.5h5"/>'),
  lane: I('<rect x="2.5" y="4" width="19" height="16" rx="1.5"/><path d="M2.5 12h19M7 4v16"/>'),
  connector: I('<path d="M4 18c6 0 4-12 12-12"/><path d="M13 4l3.4 2-2 3.4"/><circle cx="4" cy="18" r="1.5"/>'),
  th_auto: I('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/>'),
  th_light: I('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>'),
  th_dark: I('<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>'),
  menu: I('<path d="M4 7h16M4 12h16M4 17h16"/>'),
  close: I('<path d="M6 6l12 12M18 6L6 18"/>'),
  plus: I('<path d="M12 5v14M5 12h14"/>'),
  minus: I('<path d="M5 12h14"/>'),
  fit: I('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'),
  undo: I('<path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12" transform="translate(0,-6)"/>'),
  redo: I('<path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 000 12" transform="translate(0,-6)"/>'),
  trash: I('<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>'),
  copy: I('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/>'),
  edit: I('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),
  bold: I('<path d="M7 5h6a3.5 3.5 0 010 7H7zM7 12h7a3.5 3.5 0 010 7H7z" stroke-width="2.2"/>'),
  italic: I('<path d="M10 5h8M6 19h8M14 5l-4 14"/>'),
  laneAdd: I('<rect x="2.5" y="3" width="19" height="9" rx="1.5"/><path d="M12 15v6M9 18h6"/>'),
  swap: I('<path d="M4 8h14l-3-3M20 16H6l3 3"/>'),
  sElbow: I('<path d="M4 6h8v12h8"/>'),
  sStraight: I('<path d="M4 19L20 5"/>'),

  helpHtml:`<h3>Criar</h3><dl>
    <dt>R · U · D</dt><dd>Passo · Ação do utilizador · Decisão</dd>
    <dt>E · F · B</dt><dd>Ecrã · Documento · Dados</dd>
    <dt>1 · 2 · 3 · 4</dt><dd>Início · Fim · Pausa · Mudança de lane</dd>
    <dt>N · L · C</dt><dd>Nota · Swimlane · Conector</dd>
    <dt>Duplo clique</dt><dd>No vazio cria um passo; numa forma edita o texto</dd>
    <dt>Tab</dt><dd>Cria o passo seguinte, ligado à direita</dd>
    <dt>Pontos laterais</dt><dd>Arraste para ligar; clique para criar a forma seguinte. Cada lado cria a sua própria seta, por isso duas formas podem ligar-se por vários lados; as setas que saem do mesmo lado partilham o tronco</dd>
    <dt>C · Alt</dt><dd>Seta solta: com o conector, arraste de uma forma ou do vazio e largue onde quiser (ou prima Alt ao largar um ponto lateral no vazio)</dd>
    <dt>Decisão</dt><dd>Selecione-a e use a segunda lista da barra para escolher o tipo BPMN (exclusiva XOR, paralela AND, inclusiva OR, complexa)</dd>
    <dt>Pontas da seta</dt><dd>Selecione uma seta e arraste uma ponta para uma forma (liga) ou para o vazio (desliga)</dd>
    <dt>Largar ficheiro</dt><dd>Importa .drawio, .vsdx ou .json para um novo diagrama</dd></dl>
  <h3>Texto</h3><dl>
    <dt>[ · ]</dt><dd>Diminuir · aumentar texto (a caixa acompanha)</dd>
    <dt>Ctrl B · Ctrl I</dt><dd>Negrito · itálico (forma inteira ou seleção de texto)</dd>
    <dt>Markdown</dt><dd><code>**negrito**</code> e <code>*itálico*</code> dentro do texto</dd>
    <dt>Esc · Ctrl Enter</dt><dd>Terminar edição</dd></dl>
  <h3>Navegar e editar</h3><dl>
    <dt>Espaço + arrastar</dt><dd>Mover o quadro (ou botão do meio, ou H)</dd>
    <dt>Roda · pinça</dt><dd>Zoom; trackpad com dois dedos desloca</dd>
    <dt>Shift 1 · Shift 0</dt><dd>Ver tudo · 100%</dd>
    <dt>Shift A</dt><dd>Organizar o diagrama automaticamente (da esquerda para a direita, respeitando as lanes)</dd>
    <dt>Shift T</dt><dd>Alternar tema: automático · claro · escuro</dd>
    <dt>Shift L</dt><dd>Mudar idioma: português · inglês</dd>
    <dt>Ctrl C · V · D</dt><dd>Copiar · colar · duplicar</dd>
    <dt>Ctrl Z · Ctrl Shift Z</dt><dd>Desfazer · refazer</dd>
    <dt>Alt ao arrastar</dt><dd>Desliga o alinhamento automático</dd>
    <dt>Setas</dt><dd>Mover 1 px (Shift: 10 px)</dd></dl>
  <h3>Swimlanes</h3>
  <p style="margin:0;line-height:1.5;color:var(--muted)">Selecione pela faixa do título. Mover uma lane leva as formas que estão dentro. Na exportação para IA, cada forma pertence à lane onde está o seu centro.</p>`,

async function importFile(f, kind){
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  kind = kind || (ext === 'vsdx' || ext === 'vsd' ? 'visio' : ext === 'json' ? 'json' : 'drawio');
  if (kind === 'json') return importJSONFile(f);
  const base = f.name.replace(/\.(drawio|dio|xml|vsdx|vsd)$/i, '') || T('untitled');
  if (ext === 'vsd'){ errorDialog(T('imp_vsdOld')); return; }
  if (typeof DecompressionStream === 'undefined'){ errorDialog(T('imp_oldBrowser')); return; }
  const rep = newReport();
  try {
    const docs = kind === 'visio' ? await importVisio(await f.arrayBuffer(), base, rep) : await importDrawio(await f.text(), base, rep);
    if (!docs.length) throw new Error('empty');
    persistNow(); openDoc(docs[0].id);
    S.sel = new Set(rep.fallback.filter(id => N(id))); draw();
    showImportReport(rep, docs);
  } catch(err){
    console.warn('Diagramico import:', err);
    errorDialog(T(kind === 'visio' ? 'imp_failVisio' : 'imp_failDrawio'));

}
function errorDialog(msg){ modalRender = () => errorDialog(msg); dialog(T('imp_failTitle'), [el('p', 'hint', msg)], [{label: T('close'), primary: true, onClick: closeModal}]); }

// Both parsers fill the same intermediate shape: {name, lanes:[{code,name,type}], nodes:[{id,type,text,lane}], edges:[{a,b,arrow,dash,label}], notes:[{text,targets}], skipped}
const AI_REV = Object.fromEntries(Object.entries(AI_TYPE).map(([k,v]) => [v,k]));

function parseAIText(src){

}
const MM_SHAPES = [['(((',')))','end'],['((','))','circle'],['([','])','step'],['[(',')]','data'],['[[',']]','screen'],['[/','/]','user_action'],['[\\','\\]','user_action'],['[/','\\]','step'],['{{','}}','step'],['(',')','step'],['[',']','step'],['{','}','decision'],['>',']','document']];
const mmText = t => t.replace(/<br\s*\/?>/gi, '\n').replace(/#quot;|&quot;/g, '"').replace(/&amp;/g, '&').replace(/<[^>]+>/g, '').trim();
function mmRef(s, pos){
  const m = /^\s*([A-Za-z0-9_]+)/.exec(s.slice(pos)); if (!m) return null;
  let p = pos + m[0].length; const id = m[1], rest = s.slice(p), ref = {id, end:p};
  for (const [o, c, t] of MM_SHAPES){

    let q = o.length, text, e;
    if (rest[q] === '"'){ e = rest.indexOf('"', q+1); if (e < 0 || !rest.startsWith(c, e+1)) continue; text = rest.slice(q+1, e); e += 1 + c.length; }
    else { e = rest.indexOf(c, q); if (e < 0) continue; text = rest.slice(q, e); e += c.length; }

}
function mmLink(s, pos){

  }
  if ((m = /^\s*(<)?(-->|---|-\.->|-\.-|==>|===|--x|--o)\s*(?:\|"?([^|]*?)"?\|)?\s*/.exec(rest))){
    const op = (m[1]||'') + m[2]; return {arrow: m[1] && op.endsWith('>') ? 'both' : op.endsWith('>') || /[xo]$/.test(op) ? 'end' : 'none', dash: op.includes('.'), label: mmText(m[3]||''), end: pos + m[0].length};

function parseMermaid(src){

    let n = nodes.get(ref.id); if (!n){ n = {id:ref.id, type:'step', text:ref.id, lane:null, note:false}; nodes.set(ref.id, n); }
    if (ref.shape){ n.shape = ref.shape; n.text = ref.text; }
    if (ref.cls === 'note' || /^NOTE\d+$/.test(ref.id)) n.note = true;
    if (stack.length && !n.lane) n.lane = stack[stack.length-1];

  };
  let m;
  for (let raw of src.split(/\r?\n/)){
    let line = raw.replace(/%%.*$/, '').trim().replace(/;$/, ''); if (!line) continue;
    if (/^(flowchart|graph)\b/i.test(line)) continue;
    if (/^(direction|classDef|class|style|linkStyle|click|accTitle|accDescr)\b/.test(line)) continue;
    if (/^end$/i.test(line)){ stack.pop(); continue; }

    }
    let ref = mmRef(line, 0); if (!ref){ r.skipped.push(line); continue; }

  }
  const indeg = new Map(), outdeg = new Map(); for (const l of links){ indeg.set(l.b, (indeg.get(l.b)||0)+1); outdeg.set(l.a, (outdeg.get(l.a)||0)+1); }

    if (n.note){ noteOf.set(n.id, {text:n.text, targets:[]}); continue; }
    let t = n.shape === 'circle' ? ((indeg.get(n.id) && !outdeg.get(n.id)) ? 'end' : 'start') : (n.shape || 'step');
    if (n.shape === 'circle' && /^⏸\s*/.test(n.text)){ t = 'pause'; n.text = n.text.replace(/^⏸\s*/, ''); }

}
function buildDocFromParsed(r){
  const nodes = [], edges = [], byCode = new Map(), laneNodes = new Map(), count = new Map();
  r.lanes.forEach((l, i) => { const n = {id:uid('n'), type:'lane', x:0, y:i*180, w:1320, h:180, text:l.name, fs:14, color:'none'}; if (l.type) n.laneType = l.type; laneNodes.set(l.code, n); nodes.push(n); });
  for (const s of r.nodes){
    const lane = s.lane ? laneNodes.get(s.lane) : null, k = count.get(s.lane || '_') || 0; count.set(s.lane || '_', k+1);
    const n = mkNode(s.type, 150 + k*200, lane ? lane.y + 90 : r.lanes.length*180 + 90, s.text, s.gate ? {gate:s.gate} : {}); byCode.set(s.id, n); nodes.push(n);
  }

}
function detectText(src){
  if (/^\s*(?:```(?:mermaid)?\s*)?(flowchart|graph)\b/im.test(src)) return 'mermaid';

  return null;
}
function importFromText(src, fallbackName){
  const kind = detectText(src); if (!kind) return {error:T('txt_unknown')};
  const r = kind === 'ai' ? parseAIText(src) : parseMermaid(src);

  if (!r.nodes.length) return {error:T('txt_empty')};
  const {d, dropped} = buildDocFromParsed(r);
  openDoc(d.id); autoLayout(); changed(); fit();

let txtDraft = '';
function showTextImport(){
  endEdit(); closeDrawer(); modalRender = showTextImport;
  const area = el('textarea', 'import'); area.value = txtDraft; area.placeholder = T('txt_ph'); area.spellcheck = false;
  area.oninput = () => { txtDraft = area.value; };
  const err = el('p', 'hint'); err.style.color = 'var(--danger)';
  dialog(T('txt_title'), [el('p', 'hint', T('txt_hint')), area, err], [
    {label: T('cancel'), onClick: closeModal},
    {label: T('txt_create'), primary: true, onClick: () => { const res = importFromText(area.value); if (res.error){ err.textContent = res.error; return; } txtDraft = ''; closeModal(); toast(T('txt_done', res.shapes, res.edges, res.skipped)); }},

}
$('#btnImpText').onclick = showTextImport;
async function importTextFile(f){

/* ---------- drawer / portfolio ---------- */
function openDrawer(){ endEdit(); renderDocs(); $('#drawer').hidden = false; $('#scrim').hidden = false; }
function closeDrawer(){ $('#drawer').hidden = true; $('#scrim').hidden = true; }
const LOC = () => lang === 'pt' ? 'pt-PT' : 'en-GB';
const fmtDate = t => new Date(t).toLocaleString(LOC(), {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
let confirmDel = null;
function renderDocs(){
  const list = $('#doclist'); list.innerHTML = '';

  for (const d of docs){
    const it = document.createElement('div'); it.className = 'docitem' + (d.id === doc.id ? ' cur' : ''); it.tabIndex = 0;
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = d.name;
    const meta = document.createElement('div'); meta.className = 'meta'; const cnt = d.nodes.filter(n=>n.type!=='lane').length; meta.textContent = `${cnt} ${T('shapes')} · ${fmtDate(d.updated)}`;
    const acts = document.createElement('div'); acts.className = 'acts';
    const dup = btn(ICON.copy, T('dupDiagram'), ev => { ev.stopPropagation(); const c = JSON.parse(JSON.stringify(d)); c.id = uid('d'); c.name = d.name + T('copySuffix'); c.created = c.updated = Date.now(); store.docs[c.id] = c; persistNow(); renderDocs(); });
    const del = btn(ICON.trash, confirmDel === d.id ? T('confirmDel') : T('delDiagram'), ev => { ev.stopPropagation();
      if (confirmDel !== d.id){ confirmDel = d.id; renderDocs(); toast(T('clickAgainDel', d.name)); setTimeout(() => { if (confirmDel === d.id){ confirmDel = null; if (!$('#drawer').hidden) renderDocs(); } }, 4000); return; }

      if (d.id === doc.id) openDoc(Object.values(store.docs).sort((a,b)=>b.updated-a.updated)[0].id); persistNow(); renderDocs(); });
    if (confirmDel === d.id){ del.style.color = 'var(--danger)'; del.classList.add('on'); }

    it.onkeydown = ev => { if (ev.key === 'Enter') it.onclick(); };

  }
}
function openDoc(id){
  endEdit(); doc = store.docs[id]; store.current = id; reindex(); undoS = []; redoS = []; S.sel = new Set(); S.hover = null;
  $('#docName').value = doc.name;
  if (doc.view){ Object.assign(view, doc.view); draw(); } else fit();

}
$('#btnMenu').innerHTML = ICON.menu; $('#btnCloseDrawer').innerHTML = ICON.close; $('#mClose').innerHTML = ICON.close;
$('#btnMenu').onclick = openDrawer; $('#btnCloseDrawer').onclick = closeDrawer; $('#scrim').onclick = closeDrawer;
$('#btnNew').onclick = () => { const d = newDoc(); openDoc(d.id); closeDrawer(); setTimeout(() => { $('#docName').focus(); $('#docName').select(); }, 50); };
$('#docName').addEventListener('input', e => { doc.name = e.target.value || T('untitled'); scheduleSave(); });
$('#docName').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') e.target.blur(); });
$('#btnBackup').onclick = () => saveFile(`diagramico-backup-${today()}.json`, JSON.stringify({app:'diagramico', version:1, kind:'backup', exported:new Date().toISOString(), docs:Object.values(store.docs)}));
$('#btnImport').onclick = () => $('#fileIn').click();
async function importJSONFile(f){
  try {
    const o = JSON.parse(await f.text());
    const list = o.docs ? o.docs : o.doc ? [o.doc] : (o.nodes ? [o] : null);
    if (!list) throw new Error('formato');
    let n = 0, last = null;
    for (const d of list){ if (!d || !Array.isArray(d.nodes)) continue; const c = JSON.parse(JSON.stringify(d)); if (!c.id || store.docs[c.id]){ c.id = uid('d'); if (store.docs[d.id]) c.name = (c.name||'Import') + T('importedSuffix'); } c.edges = c.edges || []; c.updated = c.updated || Date.now(); store.docs[c.id] = c; n++; last = c.id; }
    if (!n) throw new Error('vazio');
    persistNow(); if (n === 1) openDoc(last); renderDocs(); toast(n === 1 ? T('imported1') : T('importedN', n));
  } catch(err){ toast(T('importFail')); }
}
$('#fileIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importJSONFile(f); };
$('#fileImp').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f){ closeModal(); importFile(f, importKind); } };
$('#btnImpDrawio').onclick = () => showImportInfo('drawio');
$('#btnImpVisio').onclick = () => showImportInfo('visio');
window.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files[0]; if (!f) return; e.preventDefault();
  if (/\.(drawio|dio|xml|vsdx|vsd|json)$/i.test(f.name)) importFile(f, null);
  else if (/\.(txt|md|mmd|mermaid)$/i.test(f.name)) importTextFile(f);

/* ---------- theme ---------- */
const THEME_KEY = 'diagramico.theme', hostTheme = document.documentElement.getAttribute('data-theme');
const THEME_NEXT = {auto:'light', light:'dark', dark:'auto'};
let themePref = 'auto'; try { themePref = localStorage.getItem(THEME_KEY) || 'auto'; } catch(e){}
function applyTheme(){
  const r = document.documentElement;
  if (themePref === 'auto'){ if (hostTheme) r.setAttribute('data-theme', hostTheme); else r.removeAttribute('data-theme'); }
  else r.setAttribute('data-theme', themePref);
  const b = $('#btnTheme'); b.innerHTML = ICON['th_' + themePref];
  const t = T('themeTitle', T('th_'+themePref), T('th_'+THEME_NEXT[themePref]).toLowerCase()); b.title = t; b.setAttribute('aria-label', t);

}

/* ---------- language ---------- */

/* ---------- misc UI ---------- */

function closePopovers(){ $('#help').hidden = true; hideTip(); }
$('#btnHelp').onclick = e => { e.stopPropagation(); $('#help').hidden = !$('#help').hidden; };
$('#btnExport').onclick = () => openExport(modalTab);
$('#zIn').innerHTML = ICON.plus; $('#zOut').innerHTML = ICON.minus; $('#zFit').innerHTML = ICON.fit; $('#bUndo').innerHTML = ICON.undo; $('#bRedo').innerHTML = ICON.redo;
$('#zIn').onclick = () => zoomAt(W/2, H/2, 1.25); $('#zOut').onclick = () => zoomAt(W/2, H/2, 0.8); $('#zFit').onclick = fit; $('#zoomPct').onclick = () => setZoom(1);

/* ---------- guided tour ---------- */
const TOUR_KEY = 'diagramico.tour';
const TOUR_TARGETS = [null, '#tools', null, null, null, '.zoom', '#btnMenu', '#btnExport', '#btnTheme', '#btnHelp'];
let tour = null;
const mdInline = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
function tourEnd(){
  if (!tour) return; tour.els.forEach(e => e.remove()); tour = null;
  try { localStorage.setItem(TOUR_KEY, '1'); } catch(e){}
  cv.focus({preventScroll:true});
}
function tourShow(){
  const steps = T('tourSteps'), s = steps[tour.i], last = tour.i === steps.length - 1;
  let tg = TOUR_TARGETS[tour.i] && $(TOUR_TARGETS[tour.i]);
  if (tg && tg.closest('[hidden]')) tg = null;
  const hl = tour.hl, card = tour.card;
  if (tg){ const r = tg.getBoundingClientRect(), p = 6; Object.assign(hl.style, {display:'block', left:(r.left-p)+'px', top:(r.top-p)+'px', width:(r.width+2*p)+'px', height:(r.height+2*p)+'px'}); }
  else Object.assign(hl.style, {display:'block', left:'50%', top:'50%', width:'0px', height:'0px'});
  card.innerHTML = `<h3></h3><p>${mdInline(s.d)}</p><div class="row"><span class="n">${T('tourOf', tour.i+1, steps.length)}</span></div>`;
  card.querySelector('h3').textContent = s.t;
  const row = card.querySelector('.row');
  const mk = (txt, cls, fn) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = txt; b.onclick = fn; row.appendChild(b); return b; };
  if (!last) mk(T('tourSkip'), '', tourEnd);
  if (tour.i) mk(T('tourBack'), '', () => { tour.i--; tourShow(); });
  const nb = mk(last ? T('tourDone') : T('tourNext'), 'primary', () => { if (last) tourEnd(); else { tour.i++; tourShow(); } });
  nb.focus();
  const cw = card.offsetWidth, ch = card.offsetHeight, m = 12;
  let x = (W - cw) / 2, y = (H - ch) / 2;
  if (tg){ const r = tg.getBoundingClientRect();
    if (r.right + m + cw < W) { x = r.right + m; y = r.top + r.height/2 - ch/2; }
    else if (r.bottom + m + ch < H) { x = r.left + r.width/2 - cw/2; y = r.bottom + m; }
    else { x = r.left + r.width/2 - cw/2; y = r.top - m - ch; } }
  card.style.left = clamp(x, 10, W - cw - 10) + 'px'; card.style.top = clamp(y, 10, H - ch - 10) + 'px';
}
function startTour(){
  tourEnd(); endEdit(); closePopovers(); closeDrawer(); if (!$('#modal').hidden) closeModal();
  const block = el('div', 'tour-block'), hl = el('div', 'tour-hl'), card = el('div', 'panel tour-card');
  card.setAttribute('role', 'dialog'); card.setAttribute('aria-live', 'polite');
  document.body.append(block, hl, card);
  tour = {i:0, els:[block, hl, card], hl, card}; tourShow();
}
window.addEventListener('keydown', e => {
  if (!tour) return;
  const n = T('tourSteps').length;
  if (e.key === 'Escape') tourEnd();
  else if (e.key === 'ArrowRight'){ if (tour.i < n-1){ tour.i++; tourShow(); } }
  else if (e.key === 'ArrowLeft'){ if (tour.i > 0){ tour.i--; tourShow(); } }
  else if (e.key === 'Enter' || e.key === 'Tab') return;
  e.stopImmediatePropagation();
}, true);
window.addEventListener('resize', () => { if (tour) tourShow(); });
$('#btnTour').innerHTML = ICON.tour; $('#btnTour').onclick = e => { e.stopPropagation(); startTour(); };

/* ---------- boot ---------- */
const FONT_FACES = ['400 14px "IBM Plex Sans"','600 14px "IBM Plex Sans"','italic 400 14px "IBM Plex Sans"','italic 600 14px "IBM Plex Sans"','400 14px "IBM Plex Mono"','600 14px "IBM Plex Mono"','italic 400 14px "IBM Plex Mono"','italic 600 14px "IBM Plex Mono"'];

doc = store.docs[store.current]; reindex();
$('#docName').value = doc.name;
resize();
if (doc.view) Object.assign(view, doc.view); else fit();
fontsReady.then(() => { LC.clear(); draw(); });
setTimeout(() => { LC.clear(); draw(); }, 1500);
persistNow();
// Phones (touch device whose shorter screen side is under 600 px) get a warning; tablets are not affected.

// expose for testing
window.__diagramico = { exportAI: () => exportAI(doc), exportMermaid: () => exportMermaid(doc), state: S, view, doc: () => doc, importText: importFromText, loadSample: () => { const s = sampleDoc(); store.docs[s.id] = s; openDoc(s.id); return s; } };
})();
